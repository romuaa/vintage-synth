name: build

# CI policy: LOCAL FIRST, CI IS A DELIBERATE CONFIRMATION STEP.
# Everything that can be checked on the developer's Mac is checked there, by scripts/preflight.sh
# (macOS universal build + tests + pluginval, sanitizers, the Linux ARM64 container, a security scan,
# repository hygiene). What only a runner can do is Windows (MSVC, x64 and ARM64), the real
# Linux x86_64 binary on the real distributions, and the Steinberg VST3 validator. So:
#  - Nothing here runs automatically: no build on pull requests, none on pushes to any branch,
#    none on main. A maintainer starts a run by hand (Actions tab, or
#    `gh workflow run build.yml --ref <branch> -f targets=<value>`).
#  - Pick `targets` (default no-macos, the normal pre-merge confirmation after the local gate is green):
#      windows    Windows x64 + ARM64 and the merged Windows bundle
#      linux-x64  the Linux x86_64 row and the distribution load tests
#      linux      both Linux rows, the sanitizers, the distribution tests and the Linux bundle
#      no-macos   everything except the macOS row (macOS is fully covered locally and is the most
#                 expensive runner)
#      all        everything: the release confirmation, run on main before a release
#  - Each run's summary page lists the commit and the selected rows, so a green run on the
#    branch tip is the recorded confirmation for the merge. The workflow file must exist on the
#    default branch for the dispatch to be offered; run it from the branch you want to confirm.
#  - Every job has a timeout, so a hung test can't burn hours. The security workflow (cheap,
#    Linux only) is separate and keeps its own triggers.
#  - Release (docs/architecture.md section 10): `-f release=true -f targets=all` runs everything above
#    with Vintage only (-DVS_BUILD_BSIDE=OFF: B-Side is not built, validated, uploaded or merged),
#    then the jobs pack (three zips + SHA256SUMS.txt, scripts/package-release.sh), zip-smoke
#    (host_smoke against the bundle unpacked from each zip) and package (a DRAFT GitHub release
#    v<version>; the only job with contents: write). Nothing is published and no tag is created:
#    the owner publishes the draft by hand. It refuses a version that already has a published
#    release and a CHANGELOG.md without a section for the version.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "What to build (see the header of this file). Default: no-macos"
        type: choice
        options: [no-macos, windows, linux-x64, linux, all]
        default: no-macos
      release:
        description: "Release run: Vintage only, then pack the zips and create a DRAFT release (needs targets=all)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Release runs share ONE group for the whole repository, whatever their ref: two releases never run at
  # once (a second one waits; it never cancels the first, because cancel-in-progress is false for it), and
  # a normal run is in another group, so it can neither cancel nor be cancelled by a release run.
  # (cancel-in-progress is read from the NEW run: it decides whether that run cancels one already running
  # in its group.) GitHub keeps at most one PENDING run per group, so a third release dispatch replaces an
  # older pending one (the running release is not touched).
  group: ${{ inputs.release && 'release' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  # pluginval release and the SHA-256 of each downloaded asset. Bump the version and all three
  # hashes together, deliberately (GitHub publishes no digest for these assets).
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_SHA256_MACOS: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_SHA256_WINDOWS: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
  PLUGINVAL_SHA256_LINUX: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  # The two plugins of this repository (docs/architecture.md 8.1): every row builds both; pluginval,
  # the VST3 validator, the architecture and dependency checks, the artifact and the bundle merge run per plugin.
  BUNDLE_VINTAGE: Exitium Vintage Synth.vst3
  BUNDLE_BSIDE: Exitium B-Side.vst3
  # "true" in a release run: Vintage only (every per-plugin step below skips B-Side).
  RELEASE_BUILD: ${{ inputs.release && 'true' || 'false' }}
  # Steinberg VST3 SDK, built only for its `validator` tool (MIT; not linked into the plugin).
  # Pinned by commit SHA; the tag is for humans. Bump both together, deliberately.
  VST3_SDK_TAG: v3.8.1_build_84
  VST3_SDK_SHA: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96

jobs:
  # The ONE place that maps `targets` to what runs. The `if:` of every job below reads these
  # outputs, so they cannot drift apart. scripts/preflight/docs-check.sh runs this step's script
  # for every target and compares the result with the documented table.
  plan:
    name: plan (${{ inputs.targets }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      distros: ${{ steps.plan.outputs.distros }}
      sanitizers: ${{ steps.plan.outputs.sanitizers }}
      windows_bundle: ${{ steps.plan.outputs.windows_bundle }}
      linux_bundle: ${{ steps.plan.outputs.linux_bundle }}
      release: ${{ inputs.release && 'true' || 'false' }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Select rows
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          # Rows of the build matrix (JSON):
          #  macos-universal  macos-26 (Apple silicon, pinned, not -latest); ccache handles the
          #                   multi-arch (-arch arm64 -arch x86_64) universal compile.
          #  windows-x64      windows-2025 (VS 2026 image, pinned); sccache.
          #  windows-arm64    windows-11-arm (VS 2026 image); no native ARM64 pluginval release yet;
          #                   the VST3 SDK validator build on ARM64 is untested (set validator true to try).
          #  linux-x64        ubuntu-22.04, the OLDEST image GitHub offers: the binary must not need a
          #                   newer glibc than the oldest distributions we support; ccache.
          #  linux-arm64      ubuntu-22.04-arm (same Ubuntu, glibc 2.35). No pluginval: v1.0.4 has no
          #                   Linux ARM64 release asset.
          MACOS='{"name":"macos-universal","os":"macos-26","cache":"ccache","pluginval":true,"validator":true}'
          WIN_X64='{"name":"windows-x64","os":"windows-2025","msvc_arch":"x64","cache":"sccache","pluginval":true,"validator":true}'
          WIN_ARM64='{"name":"windows-arm64","os":"windows-11-arm","msvc_arch":"arm64","cache":"sccache","pluginval":false,"validator":false}'
          LIN_X64='{"name":"linux-x64","os":"ubuntu-22.04","cache":"ccache","pluginval":true,"validator":true,"arch_dir":"x86_64-linux"}'
          LIN_ARM64='{"name":"linux-arm64","os":"ubuntu-22.04-arm","cache":"ccache","pluginval":false,"validator":true,"arch_dir":"aarch64-linux"}'
          # target -> rows, and which extra jobs run. The bundle jobs need both of their inputs.
          case "$TARGETS" in
            windows)   rows=("$WIN_X64" "$WIN_ARM64");                          distros=false sanitizers=false windows_bundle=true  linux_bundle=false ;;
            linux-x64) rows=("$LIN_X64");                                       distros=true  sanitizers=false windows_bundle=false linux_bundle=false ;;
            linux)     rows=("$LIN_X64" "$LIN_ARM64");                          distros=true  sanitizers=true  windows_bundle=false linux_bundle=true  ;;
            no-macos)  rows=("$WIN_X64" "$WIN_ARM64" "$LIN_X64" "$LIN_ARM64");  distros=true  sanitizers=true  windows_bundle=true  linux_bundle=true  ;;
            all)       rows=("$MACOS" "$WIN_X64" "$WIN_ARM64" "$LIN_X64" "$LIN_ARM64"); distros=true sanitizers=true windows_bundle=true linux_bundle=true ;;
            *) echo "unknown targets '$TARGETS'" >&2; exit 1 ;;
          esac
          matrix=$(printf '%s\n' "${rows[@]}" | jq -c -s '.')
          {
            echo "matrix=$matrix"
            echo "distros=$distros"
            echo "sanitizers=$sanitizers"
            echo "windows_bundle=$windows_bundle"
            echo "linux_bundle=$linux_bundle"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### CI run: targets = \`$TARGETS\`"
            echo "- commit: \`$GITHUB_SHA\` (ref \`$GITHUB_REF_NAME\`)"
            echo "- build rows: $(echo "$matrix" | jq -r 'map(.name) | join(", ")')"
            echo "- distribution tests: $distros, sanitizers: $sanitizers, Windows bundle: $windows_bundle, Linux bundle: $linux_bundle"
          } >> "$GITHUB_STEP_SUMMARY"

      # Release runs only: the checks that must hold before anything is built (contract 10.2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.release
        with:
          persist-credentials: false
          sparse-checkout: |
            CMakeLists.txt
            CHANGELOG.md
            scripts/package-release.sh

      - name: Release preconditions
        id: release
        if: inputs.release
        env:
          TARGETS: ${{ inputs.targets }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGETS" == all ]] || { echo "a release run needs targets=all (got '$TARGETS')" >&2; exit 1; }
          # The version is written once, in CMakeLists.txt.
          version=$(sed -n 's/^project(VintageSynth VERSION \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' CMakeLists.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "cannot read the version from CMakeLists.txt" >&2; exit 1; }
          # A section for this version must exist in CHANGELOG.md (it becomes the release text).
          bash scripts/package-release.sh changelog "$version" CHANGELOG.md > /dev/null
          # SOURCE.txt promises a reachable source: stop a release of a private repository before any build.
          bash scripts/package-release.sh repo-public
          # A version that already has a PUBLISHED release is never released again. A draft is fine
          # (it is replaced by the package job). Drafts may be invisible to this read-only token.
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"v$version\" and (.draft | not)) | .html_url")
          [[ -z "$published" ]] || { echo "v$version is already published: $published" >&2; exit 1; }
          # An existing tag v<version> must point at this commit (the draft is created for it).
          bash scripts/package-release.sh tag-check "$version" "$GITHUB_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "- release run for version \`$version\` (Vintage only; draft release v$version)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    # 60 min: the first run (cold compiler cache) needed about 15 to 20 min to build plus about 14 min of unit tests
    # on the Windows and Linux x86_64 rows, before pluginval; 30 min was sized for a warm cache and cancelled it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # JUCE's Linux build dependencies (docs/Linux Dependencies.md in the JUCE submodule), minus
      # webkit and curl (disabled: JUCE_WEB_BROWSER=0, JUCE_USE_CURL=0). curl is only for pluginval.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libcurl4-openssl-dev

      # Ninja + cl.exe needs the VS developer environment. Use the newest installed Visual Studio
      # (never a hardcoded version); its bundled Ninja comes onto PATH with it.
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Host "Visual Studio: $vs"
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" ${{ matrix.msvc_arch }} >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      # Compiler cache (ccache on macOS, sccache on Windows), stored in the GitHub Actions cache.
      # Unchanged JUCE and project sources are not recompiled on the next run.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.cache }}
          max-size: 2G

      # Steinberg VST3 validator, built from the pinned SDK commit (shallow clone, only the four
      # submodules the validator needs, no VSTGUI, no examples). The built binary is cached by SDK
      # SHA + runner image, so the build cost is paid once; a cache hit skips the build but the
      # binary is still located and exported below.
      - name: VST3 validator (cache)
        if: matrix.validator
        id: validator-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vst3-validator
          key: vst3-validator-v1-${{ env.VST3_SDK_SHA }}-${{ matrix.os }}-${{ matrix.name }}

      - name: VST3 validator (build)
        if: matrix.validator && steps.validator-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init -q vst3sdk/src
          git -C vst3sdk/src remote add origin https://github.com/steinbergmedia/vst3sdk.git
          git -C vst3sdk/src fetch -q --depth 1 origin "$VST3_SDK_SHA"
          git -C vst3sdk/src checkout -q --detach FETCH_HEAD
          [[ "$(git -C vst3sdk/src rev-parse HEAD)" == "$VST3_SDK_SHA" ]]
          git -C vst3sdk/src submodule update -q --init --depth 1 base cmake pluginterfaces public.sdk
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            extra+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            extra+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl)
          fi
          cmake -S vst3sdk/src -B vst3sdk/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ADD_VST3_UTILITIES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.cache }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.cache }} \
            "${extra[@]}"
          cmake --build vst3sdk/build --target validator --parallel
          exe=$(/usr/bin/find vst3sdk/build -type f \( -name validator -o -name validator.exe \) | head -n 1)
          echo "validator built at: $exe"
          test -n "$exe"
          mkdir -p vst3-validator
          cp "$exe" vst3-validator/

      # Runs on cache hits too: hand the absolute path of the validator to the Configure step.
      - name: VST3 validator (locate)
        if: matrix.validator
        shell: bash
        run: |
          set -euo pipefail
          exe=$(/usr/bin/find vst3-validator -type f \( -name validator -o -name validator.exe \) | head -n 1)
          test -n "$exe"
          if [[ "$RUNNER_OS" == "Windows" ]]; then root=$(pwd -W); else root=$(pwd); fi
          echo "VS_VST3_VALIDATOR=$root/$exe" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.cache }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.cache }}
          ${{ runner.os == 'Windows' && '-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl' || '' }}
          ${{ inputs.release && '-DVS_BUILD_BSIDE=OFF' || '' }}
          ${VS_VST3_VALIDATOR:+-DVS_VST3_VALIDATOR="$VS_VST3_VALIDATOR"}

      - name: Build
        shell: bash
        # -k 0: keep going after the first error, so one CI run reports every compiler error.
        run: cmake --build build --parallel -- -k 0

      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ${{ matrix.cache }} --show-stats || true

      # host_smoke loads the VST3 through JUCE's host, which may want a display on Linux.
      - name: Unit tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      # Per plugin: "<CMake target>|<product name>" (bundle: build/<target>_artefacts/Release/VST3/<product>.vst3).
      - name: Check architectures (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pairs=("VintageSynth|Exitium Vintage Synth")
          [[ "$RELEASE_BUILD" == true ]] || pairs+=("BSide|Exitium B-Side")
          for pair in "${pairs[@]}"; do
            target=${pair%%|*}; name=${pair#*|}
            archs=$(lipo -archs "build/${target}_artefacts/Release/VST3/$name.vst3/Contents/MacOS/$name")
            echo "$name: $archs"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          done

      - name: pluginval (macOS)
        if: matrix.pluginval && runner.os == 'macOS'
        shell: bash
        run: |
          # TODO: enable editor tests when the custom editor (M7) is merged and a display is available on the runner.
          curl -fsSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "$PLUGINVAL_SHA256_MACOS  pv.zip" | shasum -a 256 -c -
          unzip -q pv.zip
          pairs=("VintageSynth|$BUNDLE_VINTAGE")
          [[ "$RELEASE_BUILD" == true ]] || pairs+=("BSide|$BUNDLE_BSIDE")
          for pair in "${pairs[@]}"; do
            pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
              --skip-gui-tests "build/${pair%%|*}_artefacts/Release/VST3/${pair#*|}"
          done

      - name: pluginval (Windows)
        if: matrix.pluginval && runner.os == 'Windows'
        shell: bash
        run: |
          # TODO: enable editor tests when the custom editor (M7) is merged and a display is available on the runner.
          curl -fsSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          echo "$PLUGINVAL_SHA256_WINDOWS  pv.zip" | sha256sum -c -
          unzip -q pv.zip
          pairs=("VintageSynth|$BUNDLE_VINTAGE")
          [[ "$RELEASE_BUILD" == true ]] || pairs+=("BSide|$BUNDLE_BSIDE")
          for pair in "${pairs[@]}"; do
            ./pluginval.exe --strictness-level 10 --validate-in-process \
              --skip-gui-tests "build/${pair%%|*}_artefacts/Release/VST3/${pair#*|}"
          done

      # The binary must depend only on glibc and the usual system libraries (the C++ runtime is
      # linked statically); report the oldest glibc it can run on.
      - name: Check bundle and dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pairs=("VintageSynth|$BUNDLE_VINTAGE")
          [[ "$RELEASE_BUILD" == true ]] || pairs+=("BSide|$BUNDLE_BSIDE")
          for pair in "${pairs[@]}"; do
            dir="build/${pair%%|*}_artefacts/Release/VST3/${pair#*|}/Contents/${{ matrix.arch_dir }}"
            echo "=== ${pair#*|}"
            so=$(ls "$dir"/*.so | head -n 1)
            test -f "$so"
            file "$so"
            ldd "$so"
            objdump -p "$so" | grep -E "NEEDED|SONAME"
            # Captured, then tested with an explicit exit: `! cmd | grep -q` can never fail a step under
            # `set -e` (the `!` exempts the pipeline), and a `grep -q` after a pipe dies of SIGPIPE.
            ldd_out=$(ldd "$so")
            if [[ "$ldd_out" == *"not found"* ]]; then echo "ERROR: ldd reports a missing library" >&2; exit 1; fi
            if [[ "$ldd_out" == *"libstdc++"* || "$ldd_out" == *"libgcc_s"* ]]; then
              echo "ERROR: the plugin depends on a shared libstdc++ or libgcc (they must be linked statically)" >&2; exit 1
            fi
            echo "Highest required glibc symbol version:"
            objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
            echo "Highest required GLIBCXX symbol version (should be none, runtime is static):"
            objdump -T "$so" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -n 1 || true
          done

      - name: pluginval (Linux)
        if: matrix.pluginval && runner.os == 'Linux'
        shell: bash
        run: |
          # TODO: enable editor tests when the custom editor (M7) is merged and a display is available on the runner.
          curl -fsSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          echo "$PLUGINVAL_SHA256_LINUX  pv.zip" | sha256sum -c -
          unzip -q pv.zip
          chmod +x pluginval
          pairs=("VintageSynth|$BUNDLE_VINTAGE")
          [[ "$RELEASE_BUILD" == true ]] || pairs+=("BSide|$BUNDLE_BSIDE")
          for pair in "${pairs[@]}"; do
            xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
              --skip-gui-tests "build/${pair%%|*}_artefacts/Release/VST3/${pair#*|}"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vst3-vintage-${{ matrix.name }}
          retention-days: 7
          path: build/VintageSynth_artefacts/Release/VST3/${{ env.BUNDLE_VINTAGE }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RELEASE_BUILD != 'true'
        with:
          name: vst3-bside-${{ matrix.name }}
          retention-days: 7
          path: build/BSide_artefacts/Release/VST3/${{ env.BUNDLE_BSIDE }}

      # Release runs: the host_smoke program of the three rows whose zips are loaded in a host
      # (the zip-smoke job runs it against the bundle unpacked from the zip, contract 10.4).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RELEASE_BUILD == 'true' && contains(fromJSON('["macos-universal","windows-x64","linux-x64"]'), matrix.name)
        with:
          name: host-smoke-${{ matrix.name }}
          retention-days: 7
          path: build/tests/host_smoke_artefacts/Release/host_smoke*
          if-no-files-found: error

  # The bundles built by the linux-x64 row (one per plugin) must load on other distributions than the image
  # they were built on. Each entry runs pluginval (strictness 10) inside a container of that
  # distribution; the entry marked NEGATIVE is older than the glibc floor (2.35, the build image)
  # and asserts that the plugin is refused with "GLIBC_x.y not found", so the documented floor is
  # tested, not assumed. Tags are pinned by hand (Dependabot doesn't bump them): check Docker Hub
  # for newer releases when touching CI. Runs when the linux-x64 row was selected.
  linux-distros:
    name: distro ${{ matrix.name }}
    needs: [plan, build]
    # Runs when the linux-x64 row was selected, even if another row failed (fail-fast is off).
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.distros == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc: ubuntu 22.04 = 2.35 (build distribution), debian 12 = 2.36, debian 13 = 2.41,
          # ubuntu 26.04 / fedora 45 / arch = newest (each log prints the exact version).
          - name: ubuntu-22.04
            image: "ubuntu:22.04"
            pm: apt
            expect: pass
            pkgs: "libasound2 libfreetype6 libfontconfig1 libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxrender1 libxcomposite1 libxi6 libcurl4 xvfb xauth"
          - name: ubuntu-26.04
            image: "ubuntu:26.04"
            pm: apt
            expect: pass
            pkgs: "libasound2t64 libfreetype6 libfontconfig1 libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxrender1 libxcomposite1 libxi6 libcurl4t64 xvfb xauth"
          - name: debian-12
            image: "debian:bookworm-slim"
            pm: apt
            expect: pass
            pkgs: "libasound2 libfreetype6 libfontconfig1 libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxrender1 libxcomposite1 libxi6 libcurl4 xvfb xauth"
          - name: debian-13
            image: "debian:trixie-slim"
            pm: apt
            expect: pass
            pkgs: "libasound2t64 libfreetype6 libfontconfig1 libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxrender1 libxcomposite1 libxi6 libcurl4t64 xvfb xauth"
          - name: fedora-45
            image: "fedora:45"
            pm: dnf
            expect: pass
            pkgs: "alsa-lib freetype fontconfig libX11 libXext libXrandr libXinerama libXcursor libXrender libXcomposite libXi libcurl xorg-x11-server-Xvfb xauth"
          - name: arch-20261108
            image: "archlinux:base-20261108.0.623074"
            pm: pacman
            expect: pass
            pkgs: "alsa-lib freetype2 fontconfig libx11 libxext libxrandr libxinerama libxcursor libxrender libxcomposite libxi curl xorg-server-xvfb xorg-xauth"
          # NEGATIVE: glibc 2.31 < 2.35. The plugin is EXPECTED to be refused; the job is green only if it is.
          - name: negative-debian-11-glibc-2.31
            image: "debian:bullseye-slim"
            pm: none
            expect: fail
            pkgs: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/linux-check
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vst3-vintage-linux-x64
          path: ${{ env.BUNDLE_VINTAGE }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.RELEASE_BUILD != 'true'
        with:
          name: vst3-bside-linux-x64
          path: ${{ env.BUNDLE_BSIDE }}

      - name: pluginval (download, checksum)
        run: |
          curl -fsSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          echo "$PLUGINVAL_SHA256_LINUX  pv.zip" | sha256sum -c -
          unzip -q pv.zip
          chmod +x pluginval

      - name: Validate in ${{ matrix.image }}
        run: |
          start=$(date +%s)
          docker pull -q "${{ matrix.image }}" >/dev/null
          rc=0
          bundles=("/w/$BUNDLE_VINTAGE")
          [[ "$RELEASE_BUILD" == true ]] || bundles+=("/w/$BUNDLE_BSIDE")
          docker run --rm -v "$PWD":/w -w /w "${{ matrix.image }}" \
            sh /w/scripts/linux-check/distro-check.sh "${{ matrix.pm }}" "${{ matrix.expect }}" "${{ matrix.pkgs }}" \
            "${bundles[@]}" || rc=$?
          echo "distribution ${{ matrix.name }}: exit $rc after $(( $(date +%s) - start ))s"
          exit $rc

  # Merge Windows x64 + ARM64 into one .vst3 bundle per plugin (Contents/x86_64-win + Contents/arm64-win).
  windows-bundle:
    needs: [plan, build]
    # Needs both Windows builds (and, implicitly, every selected build to have succeeded).
    if: ${{ needs.plan.outputs.windows_bundle == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vst3-vintage-windows-x64, path: vintage-x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vst3-vintage-windows-arm64, path: vintage-arm64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.RELEASE_BUILD != 'true'
        with: { name: vst3-bside-windows-x64, path: bside-x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.RELEASE_BUILD != 'true'
        with: { name: vst3-bside-windows-arm64, path: bside-arm64 }
      - name: Merge
        run: |
          pairs=("vintage|$BUNDLE_VINTAGE")
          [[ "$RELEASE_BUILD" == true ]] || pairs+=("bside|$BUNDLE_BSIDE")
          for pair in "${pairs[@]}"; do
            plugin=${pair%%|*}; bundle=${pair#*|}
            mkdir -p "merged-$plugin/$bundle"
            cp -R "$plugin-x64/." "merged-$plugin/$bundle/"
            cp -R "$plugin-arm64/Contents/arm64-win" "merged-$plugin/$bundle/Contents/"
            ls -R "merged-$plugin/$bundle/Contents" | head -40
            test -d "merged-$plugin/$bundle/Contents/x86_64-win" && test -d "merged-$plugin/$bundle/Contents/arm64-win"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vst3-vintage-windows-universal
          retention-days: 7
          path: merged-vintage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RELEASE_BUILD != 'true'
        with:
          name: vst3-bside-windows-universal
          retention-days: 7
          path: merged-bside

  # Merge Linux x86_64 + ARM64 into one .vst3 bundle per plugin (Contents/x86_64-linux + Contents/aarch64-linux).
  linux-bundle:
    needs: [plan, build]
    # Needs both Linux builds (and, implicitly, every selected build to have succeeded).
    if: ${{ needs.plan.outputs.linux_bundle == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vst3-vintage-linux-x64, path: vintage-x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vst3-vintage-linux-arm64, path: vintage-arm64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.RELEASE_BUILD != 'true'
        with: { name: vst3-bside-linux-x64, path: bside-x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.RELEASE_BUILD != 'true'
        with: { name: vst3-bside-linux-arm64, path: bside-arm64 }
      - name: Merge
        run: |
          pairs=("vintage|$BUNDLE_VINTAGE")
          [[ "$RELEASE_BUILD" == true ]] || pairs+=("bside|$BUNDLE_BSIDE")
          for pair in "${pairs[@]}"; do
            plugin=${pair%%|*}; bundle=${pair#*|}
            mkdir -p "merged-$plugin/$bundle"
            cp -R "$plugin-x64/." "merged-$plugin/$bundle/"
            cp -R "$plugin-arm64/Contents/aarch64-linux" "merged-$plugin/$bundle/Contents/"
            ls -R "merged-$plugin/$bundle/Contents" | head -40
            test -n "$(ls "merged-$plugin/$bundle"/Contents/x86_64-linux/*.so)" && test -n "$(ls "merged-$plugin/$bundle"/Contents/aarch64-linux/*.so)"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vst3-vintage-linux-universal
          retention-days: 7
          path: merged-vintage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RELEASE_BUILD != 'true'
        with:
          name: vst3-bside-linux-universal
          retention-days: 7
          path: merged-bside

  # AddressSanitizer + UndefinedBehaviorSanitizer on the unit and render-regression tests.
  # Clang on the newest-but-one LTS image: best diagnostics. Runs for linux, no-macos and all.
  linux-sanitizers:
    name: linux-sanitizers
    needs: plan
    if: ${{ needs.plan.outputs.sanitizers == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: linux-sanitizers
          variant: ccache
          max-size: 2G

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      # Only the test binaries: the plugin bundles and host_smoke are covered by the linux-x64 row. The list
      # of test targets, the check that every required one exists and the per-target test count printed
      # before ctest are scripts/sanitize-targets.sh, the same file scripts/preflight.sh and the Linux
      # container check use.
      - name: Build
        run: |
          . scripts/sanitize-targets.sh
          san_select build
          cmake --build build --parallel --target "${SAN_TARGETS[@]}"
          san_report build

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Tests (ASan + UBSan)
        run: xvfb-run -a ctest --test-dir build --output-on-failure -E '^(host_smoke|host_smoke_bside)$'

  # ---- Release (docs/architecture.md section 10): only when the run was dispatched with release=true ----

  # Pack the three zips from the validated bundles and verify each zip from the zip alone. Runs on macOS
  # because the macOS zip needs ditto, lipo and codesign; the Windows and Linux zips need only `zip`.
  pack:
    name: pack release zips
    needs: [plan, build, windows-bundle, linux-bundle, linux-distros, linux-sanitizers]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vst3-vintage-macos-universal, path: "in/macos/Exitium Vintage Synth.vst3" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vst3-vintage-windows-universal, path: in/windows }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: vst3-vintage-linux-universal, path: in/linux }

      - name: Pack
        run: |
          set -euo pipefail
          for plat in macos windows linux; do
            bash scripts/package-release.sh pack --platform "$plat" --bundle "in/$plat/$BUNDLE_VINTAGE" \
              --version "$VERSION" --commit "$GITHUB_SHA" --out release \
              --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          done
          ls -l release

      - name: Verify every zip, self-test the verifier, write the checksums
        run: |
          set -euo pipefail
          for z in release/*.zip; do bash scripts/package-release.sh verify --license LICENSE "$z"; done
          bash scripts/package-release.sh selftest "release/Exitium-Vintage-Synth-$VERSION-macOS.zip"
          bash scripts/package-release.sh sums release
          bash scripts/package-release.sh sums release --check
          {
            echo "### Release zips for \`$VERSION\` (commit \`$GITHUB_SHA\`)"
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          retention-days: 14
          path: release

  # The unpacked zips load in a host (host_smoke against the bundle taken from the zip), on the three
  # platforms with a validated host: macOS, Windows x64 and Linux x86_64.
  zip-smoke:
    name: zip smoke (${{ matrix.zip }})
    needs: [plan, pack]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, zip: macOS, row: macos-universal }
          - { os: windows-2025, zip: Windows, row: windows-x64 }
          - { os: ubuntu-22.04, zip: Linux, row: linux-x64 }
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ZIP: ${{ matrix.zip }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "release-${{ needs.plan.outputs.version }}", path: release }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "host-smoke-${{ matrix.row }}", path: smoke }

      - name: Runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2 libfreetype6 libfontconfig1 libx11-6 libxext6 \
            libxrandr2 libxinerama1 libxcursor1 libxrender1 libxcomposite1 libxi6 xvfb xauth

      - name: Unpack the zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "release/Exitium-Vintage-Synth-$env:VERSION-$env:ZIP.zip" -DestinationPath unpacked

      - name: Unpack the zip (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            ditto -x -k "release/Exitium-Vintage-Synth-$VERSION-$ZIP.zip" unpacked
          else
            unzip -q "release/Exitium-Vintage-Synth-$VERSION-$ZIP.zip" -d unpacked
          fi

      - name: host_smoke against the unpacked bundle
        shell: bash
        run: |
          set -euo pipefail
          # Absolute native paths on every platform (pwd -W gives C:/... in Git Bash).
          if [[ "$RUNNER_OS" == Windows ]]; then root=$(pwd -W); else root=$(pwd); fi
          bundle="$root/unpacked/Exitium Vintage Synth $VERSION/Exitium Vintage Synth.vst3"
          test -d "$bundle"
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$root/smoke/host_smoke.exe" --profile vintage "$bundle"
          else
            chmod +x "$root/smoke/host_smoke"
            if [[ "$RUNNER_OS" == Linux ]]; then
              xvfb-run -a "$root/smoke/host_smoke" --profile vintage "$bundle"
            else
              "$root/smoke/host_smoke" --profile vintage "$bundle"
            fi
          fi

  # The ONLY job with write access. Creates (or replaces) the DRAFT release v<version> with the zips,
  # the checksums and the CHANGELOG section as its text. Nothing is published and no tag is created
  # until the owner publishes the draft. Refuses a version that already has a published release.
  package:
    name: package (draft release)
    needs: [plan, pack, zip-smoke]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "release-${{ needs.plan.outputs.version }}", path: release }

      - name: Draft release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # The files must be the ones the pack job verified.
          bash scripts/package-release.sh sums release --check
          # SOURCE.txt promises a reachable source: no draft for a private repository. The tag must be absent
          # or point at this commit.
          bash scripts/package-release.sh repo-public
          bash scripts/package-release.sh tag-check "$VERSION" "$GITHUB_SHA"
          # The release text: a fixed header (unsigned, experimental ARM64 builds) and the CHANGELOG section.
          { cat resources/release/RELEASE-NOTES-HEADER.md; bash scripts/package-release.sh changelog "$VERSION" CHANGELOG.md; } > release-notes.md
          # Existing releases with this tag: a published one stops the run; a draft is replaced (deleted and
          # created again, so its assets and target are exactly this run's).
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"" > existing.txt
          while read -r id draft; do
            [[ -n "$id" ]] || continue
            [[ "$draft" == true ]] || { echo "release $tag is already published; refusing to touch it" >&2; exit 1; }
          done < existing.txt
          while read -r id draft; do
            [[ -n "$id" ]] || continue
            # Read the state again right before deleting: a draft published in the meantime is never deleted.
            now=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .draft)
            [[ "$now" == true ]] || { echo "release $id of $tag is no longer a draft; refusing to delete it" >&2; exit 1; }
            echo "replacing the draft $id of $tag"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done < existing.txt
          gh release create "$tag" release/*.zip release/SHA256SUMS.txt \
            --draft --target "$GITHUB_SHA" --title "Exitium Vintage Synth $VERSION" --notes-file release-notes.md
          echo "Draft release $tag created for commit $GITHUB_SHA. Publish it by hand when the owner gate is passed." >> "$GITHUB_STEP_SUMMARY"
